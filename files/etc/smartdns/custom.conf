# smartdns 预置上游与测速策略，可按需修改
speed-check-mode ping,tcp:80

# 国内公共 DNS（IPv4，默认分组）
server 223.5.5.5
server 223.6.6.6
server 119.29.29.29
server 119.28.28.28
server 180.76.76.76
server 114.114.114.114
server 114.114.115.115

# 国内公共 DNS（IPv6，需路由器有 IPv6 出口）
server 2400:3200::1
server 2400:3200:baba::1
server 2402:4e00::
server 2402:4e00:1::
server 2400:da00::6666
server 240c::6666
server 240c::6644

# 加密上游（DoH / DoT），与上面的一起参与并发查询和测速
server-https https://dns.alidns.com/dns-query
server-https https://doh.pub/dns-query
server-tls 223.5.5.5 -host-name dns.alidns.com

# 中国移动（湖北/武汉）：移动 DNS 按省份分配，跨省使用可能出现解析偏差
server 211.137.58.20
server 211.137.58.21
server 211.137.64.163
server 2409:804c:2000:0001::1
server 2409:804c:2000:0002::1
server 2409:8088::a
server 2409:8088::b

# 更多可选上游，取消注释即可启用
# server 101.6.6.6 中科大 DNS
# server 202.141.162.123 中科大 DNS
# server-https https://doh.360.cn/dns-query 360 DoH
# server-tls 1dot1dot1dot1.cloudflare-dns.com Cloudflare DoT（国内可能超时）
